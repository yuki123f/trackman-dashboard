<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Range Log — TrackMan Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#14171a;
    --panel:#1b1f23;
    --panel-raised:#20252a;
    --line:#2a2f34;
    --text:#eef0ea;
    --text-muted:#8b9198;
    --turf:#7fae5f;
    --turf-dim:rgba(127,174,95,0.16);
    --flag:#d68b3d;
    --focus:#c9d6c1;
    --radius:10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--turf-dim);color:var(--text);}

  a,button,input{font-family:inherit;}
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:28px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .title-block h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(28px,4vw,38px);
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  .title-block h1 .dot{color:var(--turf);}
  .title-block p{
    margin:0;
    color:var(--text-muted);
    font-size:14px;
  }
  .session-count{
    font-family:'IBM Plex Mono',monospace;
    text-align:right;
  }
  .session-count .n{
    font-size:32px;
    font-weight:600;
    color:var(--turf);
    line-height:1;
    display:block;
  }
  .session-count .l{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
  }

  .data-source{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 20px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  .data-source .ds-label{font-size:12px;color:var(--text-muted);flex:1;min-width:180px;}
  .data-source .ds-label strong{color:var(--text);font-weight:500;}
  .upload-btn{
    background:var(--panel-raised);
    border:1px solid var(--turf);
    color:var(--turf);
    border-radius:20px;
    padding:8px 16px;
    font-size:12.5px;
    cursor:pointer;
    transition:background .15s;
  }
  .upload-btn:hover{background:var(--turf-dim);}
  #csvUpload{display:none;}
  .ds-status{font-size:12px;color:var(--text-muted);}
  .ds-status.ok{color:var(--turf);}
  .ds-status.err{color:var(--flag);}

  .filters{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:24px;
    display:flex;
    flex-wrap:wrap;
    gap:22px;
    align-items:flex-start;
  }
  .filter-group{display:flex;flex-direction:column;gap:8px;}
  .filter-group .fg-label{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .date-inputs{display:flex;align-items:center;gap:8px;}
  .date-inputs input[type=date]{
    background:var(--panel-raised);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:7px 9px;
    font-size:13px;
    font-family:'IBM Plex Mono',monospace;
    color-scheme:dark;
  }
  .date-inputs span{color:var(--text-muted);font-size:12px;}
  .quick-ranges{display:flex;gap:6px;flex-wrap:wrap;}
  .quick-ranges button{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-muted);
    border-radius:20px;
    padding:5px 12px;
    font-size:12px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .quick-ranges button:hover{color:var(--text);border-color:var(--text-muted);}
  .quick-ranges button.active{color:var(--void);background:var(--turf);border-color:var(--turf);}

  .club-chips{display:flex;flex-wrap:wrap;gap:7px;max-width:560px;}
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--panel-raised);
    border:1px solid var(--line);
    color:var(--text-muted);
    border-radius:20px;
    padding:6px 12px 6px 9px;
    font-size:12.5px;
    cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
    user-select:none;
  }
  .chip .sw{width:8px;height:8px;border-radius:50%;flex:none;}
  .chip.active{color:var(--text);border-color:var(--chip-color,var(--turf));background:color-mix(in srgb, var(--chip-color,var(--turf)) 14%, transparent);}
  .chip:not(.active){opacity:0.55;}
  .chip-actions{display:flex;gap:8px;align-self:center;}
  .chip-actions button{
    background:none;border:none;color:var(--text-muted);
    font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0;
  }
  .chip-actions button:hover{color:var(--text);}

  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:24px;
  }
  .stat{
    background:var(--panel);
    padding:16px 18px;
  }
  .stat .v{
    font-family:'IBM Plex Mono',monospace;
    font-size:26px;
    font-weight:500;
    letter-spacing:-0.01em;
  }
  .stat .v small{font-size:13px;color:var(--text-muted);font-weight:400;}
  .stat .k{
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-top:4px;
  }

  .grid{
    display:grid;
    grid-template-columns:1.1fr 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:860px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:20px;
  }
  .panel h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:600;
    margin:0 0 2px;
  }
  .panel .sub{
    font-size:12px;
    color:var(--text-muted);
    margin:0 0 16px;
  }
  .panel.full{grid-column:1 / -1;}

  .empty{
    color:var(--text-muted);
    font-size:13px;
    padding:40px 0;
    text-align:center;
  }

  #dispersion{width:100%;height:auto;display:block;}
  .chart-svg-wrap svg{width:100%;height:auto;display:block;overflow:visible;}
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px 16px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);}
  .legend-item .sw{width:8px;height:8px;border-radius:50%;}
  .legend-item.line .sw{border-radius:2px;width:14px;height:3px;}

  footer{
    margin-top:8px;
    color:var(--text-muted);
    font-size:11.5px;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <h1>Range Log<span class="dot">.</span></h1>
      <p id="dateRangeSub">セッションデータを読み込み中…</p>
    </div>
    <div class="session-count">
      <span class="n" id="shotCount">–</span>
      <span class="l">Shots in view</span>
    </div>
  </header>

  <div class="data-source">
    <div class="ds-label"><strong>データソース:</strong> <span id="dsName">最初にアップロードされたCSV(スナップショット)</span></div>
    <button class="upload-btn" id="driveReload" type="button">Driveから再読み込み</button>
    <label class="upload-btn" for="csvUpload">CSVを手動で読み込む</label>
    <input type="file" id="csvUpload" accept=".csv">
    <span class="ds-status" id="dsStatus"></span>
  </div>

  <div class="filters">
    <div class="filter-group">
      <span class="fg-label">期間</span>
      <div class="date-inputs">
        <input type="date" id="dateFrom">
        <span>–</span>
        <input type="date" id="dateTo">
      </div>
      <div class="quick-ranges" id="quickRanges">
        <button data-range="today">最新の1回</button>
        <button data-range="7">直近7日</button>
        <button data-range="30">直近30日</button>
        <button data-range="all" class="active">全期間</button>
      </div>
    </div>
    <div class="filter-group" style="flex:1;min-width:260px;">
      <span class="fg-label">クラブ</span>
      <div class="club-chips" id="clubChips"></div>
      <div class="chip-actions">
        <button id="selectAll">すべて選択</button>
        <button id="selectNone">選択解除</button>
      </div>
    </div>
  </div>

  <div class="stats" id="statStrip"></div>

  <div class="grid">
    <div class="panel">
      <h2>飛球分散 — Dispersion</h2>
      <p class="sub">フェアウェイ上空から見たキャリー距離と左右のブレ(ヤード)</p>
      <div id="dispersionWrap"><svg id="dispersion" viewBox="0 0 560 620"></svg></div>
      <div class="legend" id="dispersionLegend"></div>
    </div>

    <div class="panel">
      <h2>クラブ別平均</h2>
      <p class="sub">選択中のクラブ・期間での平均飛距離(ヤード)。濃い色=キャリー、薄い色=トータル</p>
      <div class="chart-svg-wrap" id="clubBarChart"></div>
    </div>

    <div class="panel full">
      <h2>キャリー距離の推移</h2>
      <p class="sub">セッション日ごとの平均キャリー距離。クラブごとに色分け</p>
      <div class="chart-svg-wrap" id="trendChart"></div>
      <div class="legend" id="trendLegend"></div>
    </div>
  </div>

  <footer>すべての集計と読み込みはブラウザ内で完結しています(外部通信なし)</footer>
</div>

const CLUB_ORDER = ["Driver","4Hybrid","4Iron","6Iron","7Iron","8Iron","9Iron","PitchingWedge","58Wedge"];
const CLUB_LABEL = {
  "Driver":"Driver","4Hybrid":"4H","4Iron":"4I","6Iron":"6I","7Iron":"7I",
  "8Iron":"8I","9Iron":"9I","PitchingWedge":"PW","58Wedge":"58°W"
};
const COOL = '#5b8fae';
const WARM = '#d6603d';

const $ = sel => document.querySelector(sel);
function hexLerp(a, b, t){
  const pa = [1,3,5].map(i=>parseInt(a.substr(i,2),16));
  const pb = [1,3,5].map(i=>parseInt(b.substr(i,2),16));
  const out = pa.map((v,i)=>Math.round(v + (pb[i]-v)*t));
  return '#'+out.map(v=>v.toString(16).padStart(2,'0')).join('');
}
function avg(arr, key){
  const v = arr.map(r=>r[key]).filter(x=>x!==null && x!==undefined && !isNaN(x));
  if(!v.length) return null;
  return v.reduce((a,b)=>a+b,0)/v.length;
}
function fmt(n, digits=1){ return (n===null || n===undefined || isNaN(n)) ? '—' : n.toFixed(digits); }

// ---- mutable app state ----
let RAW = [];
let clubsPresent = [];
let CLUB_COLOR = {};
let allDates = [];
let minDate = null, maxDate = null;
let activeClubs = new Set();

const dateFrom = $('#dateFrom'), dateTo = $('#dateTo');
const chipWrap = $('#clubChips');

function buildClubColors(){
  CLUB_COLOR = {};
  clubsPresent.forEach((c,i)=>{
    const t = clubsPresent.length<=1 ? 0 : i/(clubsPresent.length-1);
    CLUB_COLOR[c] = hexLerp(COOL, WARM, t);
  });
}

function buildChips(){
  chipWrap.innerHTML = '';
  clubsPresent.forEach(c=>{
    const chip = document.createElement('div');
    chip.className = 'chip active';
    chip.style.setProperty('--chip-color', CLUB_COLOR[c]);
    chip.dataset.club = c;
    chip.innerHTML = `<span class="sw" style="background:${CLUB_COLOR[c]}"></span>${CLUB_LABEL[c]||c}`;
    chip.addEventListener('click', ()=>{
      if(activeClubs.has(c)){ activeClubs.delete(c); chip.classList.remove('active'); }
      else { activeClubs.add(c); chip.classList.add('active'); }
      render();
    });
    chipWrap.appendChild(chip);
  });
}

function initFromData(rawArray, sourceLabel){
  RAW = rawArray.filter(r=>r.Date && r.Club);
  clubsPresent = CLUB_ORDER.filter(c => RAW.some(r=>r.Club===c));
  // include any club not in known order (unexpected new club names) at the end
  const extra = [...new Set(RAW.map(r=>r.Club))].filter(c=>!clubsPresent.includes(c));
  clubsPresent = clubsPresent.concat(extra);
  buildClubColors();

  allDates = [...new Set(RAW.map(r=>r.Date))].sort();
  minDate = allDates[0]; maxDate = allDates[allDates.length-1];

  dateFrom.min = minDate; dateFrom.max = maxDate;
  dateTo.min = minDate; dateTo.max = maxDate;
  dateFrom.value = minDate; dateTo.value = maxDate;
  document.querySelectorAll('#quickRanges button').forEach(b=>b.classList.remove('active'));
  $('#quickRanges button[data-range="all"]').classList.add('active');

  $('#dateRangeSub').textContent = `${minDate} 〜 ${maxDate} · ${clubsPresent.length}クラブ · ${RAW.length}ショット記録`;
  if(sourceLabel) $('#dsName').textContent = sourceLabel;

  activeClubs = new Set(clubsPresent);
  buildChips();
  render();
}

$('#selectAll').addEventListener('click', ()=>{
  clubsPresent.forEach(c=>activeClubs.add(c));
  document.querySelectorAll('.chip').forEach(el=>el.classList.add('active'));
  render();
});
$('#selectNone').addEventListener('click', ()=>{
  activeClubs.clear();
  document.querySelectorAll('.chip').forEach(el=>el.classList.remove('active'));
  render();
});
document.querySelectorAll('#quickRanges button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#quickRanges button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const r = btn.dataset.range;
    if(r==='all'){ dateFrom.value = minDate; dateTo.value = maxDate; }
    else if(r==='today'){
      dateFrom.value = maxDate;
      dateTo.value = maxDate;
    }
    else {
      const days = parseInt(r,10);
      const end = new Date(maxDate+'T00:00:00');
      const start = new Date(end); start.setDate(start.getDate() - (days-1));
      const startStr = start.toISOString().slice(0,10);
      dateFrom.value = startStr < minDate ? minDate : startStr;
      dateTo.value = maxDate;
    }
    render();
  });
});
[dateFrom, dateTo].forEach(inp=>inp.addEventListener('change', ()=>{
  document.querySelectorAll('#quickRanges button').forEach(b=>b.classList.remove('active'));
  render();
}));

function filtered(){
  const from = dateFrom.value || minDate, to = dateTo.value || maxDate;
  return RAW.filter(r => activeClubs.has(r.Club) && r.Date >= from && r.Date <= to);
}

function renderStats(data){
  const strip = $('#statStrip');
  const items = [
    {k:'ショット数', v: data.length, unit:''},
    {k:'平均キャリー', v: fmt(avg(data,'Carry')), unit:'yd'},
    {k:'平均トータル', v: fmt(avg(data,'Total')), unit:'yd'},
    {k:'平均ヘッドスピード', v: fmt(avg(data,'ClubSpeed')), unit:'mph'},
    {k:'平均スマッシュ係数', v: fmt(avg(data,'SmashFactor'),2), unit:''},
    {k:'平均スピン量', v: fmt(avg(data,'SpinRate'),0), unit:'rpm'},
  ];
  strip.innerHTML = items.map(it=>`
    <div class="stat">
      <div class="v">${it.v}${it.unit?` <small>${it.unit}</small>`:''}</div>
      <div class="k">${it.k}</div>
    </div>`).join('');
  $('#shotCount').textContent = data.length;
}

function renderDispersion(data){
  const svg = $('#dispersion');
  const W = 560, H = 620;
  const valid = data.filter(r=>r.Carry!=null && r.CarrySide!=null);
  if(!valid.length){
    svg.innerHTML = `<text x="${W/2}" y="${H/2}" fill="#8b9198" font-size="13" text-anchor="middle">表示できるショットがありません</text>`;
    $('#dispersionLegend').innerHTML='';
    return;
  }
  const maxCarry = Math.max(...valid.map(r=>r.Carry)) * 1.12;
  const maxSide = Math.max(40, Math.max(...valid.map(r=>Math.abs(r.CarrySide))) * 1.25);
  const cx = W/2, baseY = H - 40;
  const yardsToPxY = y => baseY - (y/maxCarry) * (H-80);
  const sideToPxX = x => cx + (x/maxSide) * (W/2 - 30);

  let svgParts = [];
  const ringStep = maxCarry > 200 ? 50 : (maxCarry > 100 ? 25 : 10);
  for(let y = ringStep; y < maxCarry; y += ringStep){
    const py = yardsToPxY(y);
    const r = (W/2 - 30) * (y/maxCarry);
    svgParts.push(`<path d="M ${cx-r} ${py} A ${r} ${r} 0 0 1 ${cx+r} ${py}" fill="none" stroke="#2a2f34" stroke-width="1"/>`);
    svgParts.push(`<text x="${cx+r+6}" y="${py+3}" fill="#5a6067" font-size="10" font-family="IBM Plex Mono, monospace">${y}</text>`);
  }
  svgParts.push(`<line x1="${cx}" y1="${baseY}" x2="${cx}" y2="${yardsToPxY(maxCarry)}" stroke="#2a2f34" stroke-width="1" stroke-dasharray="3 4"/>`);
  svgParts.push(`<circle cx="${cx}" cy="${baseY}" r="4" fill="#7fae5f"/>`);

  valid.forEach(r=>{
    const px = sideToPxX(r.CarrySide);
    const py = yardsToPxY(r.Carry);
    const color = CLUB_COLOR[r.Club] || '#8b9198';
    svgParts.push(`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" fill="${color}" fill-opacity="0.55" stroke="${color}" stroke-opacity="0.85" stroke-width="1"><title>${r.Club} · ${r.Carry}yd · ${r.CarrySide>0?'R':'L'}${Math.abs(r.CarrySide).toFixed(0)}</title></circle>`);
  });

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = svgParts.join('');

  const legend = $('#dispersionLegend');
  legend.innerHTML = [...activeClubs].filter(c=>clubsPresent.includes(c)).sort((a,b)=>clubsPresent.indexOf(a)-clubsPresent.indexOf(b))
    .map(c=>`<div class="legend-item"><span class="sw" style="background:${CLUB_COLOR[c]}"></span>${CLUB_LABEL[c]||c}</div>`).join('');
}

function niceStep(maxVal){
  const rough = maxVal / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rough||1)));
  const norm = rough / mag;
  let step;
  if(norm < 1.5) step = 1*mag;
  else if(norm < 3) step = 2*mag;
  else if(norm < 7) step = 5*mag;
  else step = 10*mag;
  return step || 1;
}

function renderBarChart(data){
  const container = $('#clubBarChart');
  const clubs = [...activeClubs].filter(c=>clubsPresent.includes(c)).sort((a,b)=>clubsPresent.indexOf(a)-clubsPresent.indexOf(b));
  const carryValues = clubs.map(c=>avg(data.filter(r=>r.Club===c),'Carry'));
  const totalValues = clubs.map(c=>avg(data.filter(r=>r.Club===c),'Total'));
  if(!clubs.length || (carryValues.every(v=>v===null) && totalValues.every(v=>v===null))){
    container.innerHTML = `<div class="empty">表示できるデータがありません</div>`;
    return;
  }
  const W = 520, H = 300, padL = 40, padB = 34, padT = 16, padR = 10;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const allVals = [...carryValues, ...totalValues].filter(v=>v!==null);
  const maxVal = Math.max(...allVals) * 1.15;
  const step = niceStep(maxVal);
  const niceMax = Math.ceil(maxVal/step)*step;

  let parts = [];
  for(let gv=0; gv<=niceMax; gv+=step){
    const gy = padT + plotH - (gv/niceMax)*plotH;
    parts.push(`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#2a2f34" stroke-width="1"/>`);
    parts.push(`<text x="${padL-8}" y="${gy+3}" fill="#8b9198" font-size="10" font-family="IBM Plex Mono, monospace" text-anchor="end">${Math.round(gv)}</text>`);
  }
  const slot = plotW/clubs.length;
  const groupW = Math.min(52, slot*0.62);
  const bw = groupW/2 - 1.5;
  clubs.forEach((c,i)=>{
    const cv = carryValues[i];
    const tv = totalValues[i];
    const groupX = padL + slot*i + (slot-groupW)/2;
    const color = CLUB_COLOR[c];
    const lightColor = hexLerp(color, '#ffffff', 0.55);
    if(cv!==null){
      const bh = (cv/niceMax)*plotH;
      const by = padT + plotH - bh;
      parts.push(`<rect x="${groupX.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${color}"><title>${c} キャリー: ${fmt(cv)} yd</title></rect>`);
      parts.push(`<text x="${(groupX+bw/2).toFixed(1)}" y="${(by-5).toFixed(1)}" fill="#eef0ea" font-size="9.5" font-family="IBM Plex Mono, monospace" text-anchor="middle">${fmt(cv,0)}</text>`);
    }
    if(tv!==null){
      const bx2 = groupX + bw + 3;
      const bh2 = (tv/niceMax)*plotH;
      const by2 = padT + plotH - bh2;
      parts.push(`<rect x="${bx2.toFixed(1)}" y="${by2.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh2.toFixed(1)}" rx="3" fill="${lightColor}"><title>${c} トータル: ${fmt(tv)} yd</title></rect>`);
      parts.push(`<text x="${(bx2+bw/2).toFixed(1)}" y="${(by2-5).toFixed(1)}" fill="#8b9198" font-size="9.5" font-family="IBM Plex Mono, monospace" text-anchor="middle">${fmt(tv,0)}</text>`);
    }
    parts.push(`<text x="${(groupX+groupW/2).toFixed(1)}" y="${H-padB+16}" fill="#8b9198" font-size="11" text-anchor="middle">${CLUB_LABEL[c]||c}</text>`);
  });
  parts.push(`<line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="#3a4046" stroke-width="1"/>`);

  container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="クラブ別平均キャリー・トータル距離">${parts.join('')}</svg>`;
}

function renderTrendChart(data){
  const container = $('#trendChart');
  const dates = [...new Set(data.map(r=>r.Date))].sort();
  const clubs = [...activeClubs].filter(c=>clubsPresent.includes(c)).sort((a,b)=>clubsPresent.indexOf(a)-clubsPresent.indexOf(b));
  if(!dates.length || !clubs.length){
    container.innerHTML = `<div class="empty">表示できるデータがありません</div>`;
    $('#trendLegend').innerHTML = '';
    return;
  }
  const series = clubs.map(c=>({
    club:c,
    points: dates.map(d=>avg(data.filter(r=>r.Club===c && r.Date===d),'Carry'))
  }));
  const allVals = series.flatMap(s=>s.points).filter(v=>v!==null);
  const maxVal = Math.max(...allVals) * 1.12;
  const minVal = Math.max(0, Math.min(...allVals) * 0.85);

  const W = 1080, H = 320, padL = 42, padB = 40, padT = 16, padR = 16;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const step = niceStep(maxVal-minVal);
  const niceMax = Math.ceil(maxVal/step)*step;
  const niceMin = Math.floor(minVal/step)*step;

  const xFor = i => dates.length<=1 ? padL+plotW/2 : padL + (i/(dates.length-1))*plotW;
  const yFor = v => padT + plotH - ((v-niceMin)/(niceMax-niceMin || 1))*plotH;

  let parts = [];
  for(let gv=niceMin; gv<=niceMax; gv+=step){
    const gy = yFor(gv);
    parts.push(`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#2a2f34" stroke-width="1"/>`);
    parts.push(`<text x="${padL-8}" y="${gy+3}" fill="#8b9198" font-size="10" font-family="IBM Plex Mono, monospace" text-anchor="end">${Math.round(gv)}</text>`);
  }
  const labelEvery = Math.max(1, Math.ceil(dates.length/10));
  dates.forEach((d,i)=>{
    if(i%labelEvery===0 || i===dates.length-1){
      parts.push(`<text x="${xFor(i).toFixed(1)}" y="${H-padB+18}" fill="#8b9198" font-size="10" font-family="IBM Plex Mono, monospace" text-anchor="middle">${d.slice(5)}</text>`);
    }
  });

  series.forEach(s=>{
    const color = CLUB_COLOR[s.club];
    let d = '';
    let drawing = false;
    s.points.forEach((v,i)=>{
      if(v===null){ drawing=false; return; }
      const x = xFor(i), y = yFor(v);
      d += (drawing ? ' L ' : ' M ') + x.toFixed(1) + ' ' + y.toFixed(1);
      drawing = true;
    });
    if(d) parts.push(`<path d="${d.trim()}" fill="none" stroke="${color}" stroke-width="2"/>`);
    s.points.forEach((v,i)=>{
      if(v===null) return;
      parts.push(`<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="3" fill="${color}"><title>${s.club} · ${dates[i]} · ${fmt(v)}yd</title></circle>`);
    });
  });
  parts.push(`<line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="#3a4046" stroke-width="1"/>`);

  container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="キャリー距離の推移">${parts.join('')}</svg>`;

  $('#trendLegend').innerHTML = clubs.map(c=>`<div class="legend-item line"><span class="sw" style="background:${CLUB_COLOR[c]}"></span>${CLUB_LABEL[c]||c}</div>`).join('');
}

// ---- CSV upload / parsing ----
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const rows = [];
  let i=0, field='', row=[], inQuotes=false;
  const pushField=()=>{row.push(field);field='';};
  const pushRow=()=>{rows.push(row);row=[];};
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field+='"'; i+=2; continue; }
        inQuotes=false; i++; continue;
      } else { field+=c; i++; continue; }
    } else {
      if(c === '"'){ inQuotes=true; i++; continue; }
      if(c === ','){ pushField(); i++; continue; }
      if(c === '\r'){ i++; continue; }
      if(c === '\n'){ pushField(); pushRow(); i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length){ pushField(); pushRow(); }
  if(!rows.length) return [];
  const headers = rows.shift();
  return rows.filter(r=>r.length===headers.length && r.some(x=>x!=='')).map(r=>{
    const obj={};
    headers.forEach((h,idx)=>obj[h]=r[idx]);
    return obj;
  });
}

function toShot(rawRow){
  const num = v => { if(v===undefined||v==='') return null; const f = parseFloat(v); return isNaN(f) ? null : Math.round(f*100)/100; };
  return {
    Date: rawRow.Date,
    Club: rawRow.Club,
    ShotNumber: rawRow.ShotNumber ? parseInt(rawRow.ShotNumber,10) : null,
    ClubSpeed: num(rawRow.ClubSpeed),
    BallSpeed: num(rawRow.BallSpeed),
    SmashFactor: num(rawRow.SmashFactor),
    LaunchAngle: num(rawRow.LaunchAngle),
    SpinRate: num(rawRow.SpinRate),
    MaxHeight: num(rawRow.MaxHeight),
    Carry: num(rawRow.Carry),
    Total: num(rawRow.Total),
    CarrySide: num(rawRow.CarrySide),
    TotalSide: num(rawRow.TotalSide),
    ShotQuality: rawRow.ShotQuality || ''
  };
}

$('#csvUpload').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = $('#dsStatus');
  statusEl.textContent = '読み込み中…';
  statusEl.className = 'ds-status';
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const rows = parseCSV(reader.result);
      const shots = rows.map(toShot).filter(s=>s.Date && s.Club);
      if(!shots.length) throw new Error('empty');
      initFromData(shots, file.name);
      statusEl.textContent = `${file.name} を読み込みました(${shots.length}ショット)`;
      statusEl.className = 'ds-status ok';
    }catch(err){
      statusEl.textContent = 'CSVを読み込めませんでした。列名(Date, Club, Carryなど)を確認してください';
      statusEl.className = 'ds-status err';
    }
  };
  reader.onerror = () => {
    statusEl.textContent = 'ファイルの読み込みに失敗しました';
    statusEl.className = 'ds-status err';
  };
  reader.readAsText(file, 'UTF-8');
});
